# Cloud Build: build image, push, deploy to Cloud Run (data lives in Firestore, so there is no migration step).
# Trigger: push to main. Substitutions have defaults for the single POC environment.
substitutions:
  _REGION: us-central1
  _REPO: prioritize-ai
  _SERVICE: prioritize-ai
  _RUN_SA: prioritize-ai-run
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$BUILD_ID', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$BUILD_ID']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_RUN_SA}@$PROJECT_ID.iam.gserviceaccount.com
      # Firestore needs no connector. Clearing is idempotent and drops the old Cloud SQL attachment.
      - --clear-cloudsql-instances
      - --set-secrets=SESSION_SECRET=SESSION_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest
      - --set-env-vars=AI_PROVIDER=vertex,GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=${_REGION}
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --allow-unauthenticated
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$BUILD_ID
